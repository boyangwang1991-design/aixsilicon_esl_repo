schema_version: 1
id: aixsilicon:esl:gpio:0.1.0
factory: aix::esl::gpio::Model
model_kinds:
- behavioral
- software_visible
profiles:
  register:
    timing_model: annotated
    data_modes:
    - full_data
    interface_mode: register
    transport: LT
    capabilities:
    - mmio32
    - level_irq
    - reset_cancel
    - drain
    - rising_edge_irq
ports:
  registers:
    direction: target
    type: tlm_generic_payload
    transport: LT
    bus_width: 32
    binding: one_or_more
  reset:
    direction: input
    type: sc_in<bool>
    binding: required
    active: high
  irq:
    direction: output
    type: sc_out<bool>
    binding: required
    active: high
  inputs:
    direction: input
    type: sc_in<sc_uint<32>>
    binding: required
  outputs:
    direction: output
    type: sc_out<sc_uint<32>>
    binding: required
  output_enable:
    direction: output
    type: sc_out<sc_uint<32>>
    binding: required
parameters:
  access_latency:
    type: time
    default: 1 ns
  width:
    type: integer
    default: 32
    min: 1
    max: 32
assumptions:
- exploratory_abi
- one_outstanding
- no_at
- no_dmi
- no_debug
- full_word_access_only
- rising_edges_only
- no_electrical_or_cdc_model
build:
  backend: cmake
  package: AixEslGpio
  target: aix::esl::gpio
  cxx_standard: 17
  entry: CMakeLists.txt
