[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aixsilicon-esl-repo"
version = "0.1.0"
description = "ESL architecture-exploration models and common components (assets only; methods live in esl-development-suite skill)"
requires-python = ">=3.10"
license = { text = "Proprietary" }

[project.optional-dependencies]
# 本地开发/回归统一使用 workflow 根环境（uv sync 于 workflow 根）；
# 本文件作为 esl_repo 独立 CI 的事实源声明，不用于创建第二个 .venv。
dev = ["pytest>=7", "PyYAML>=6"]
analysis = ["matplotlib>=3.8", "numpy>=1.24"]

[tool.setuptools]
packages = []
# SystemC libraries install with CMake; Python helpers run from this source tree.

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = ["reference", "templates", "runs", "build"]
addopts = "-q"
